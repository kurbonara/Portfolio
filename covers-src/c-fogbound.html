<html><head><link rel="stylesheet" href="kit.css"><style>
body { --bg:#0b1626; --c1:#1e3a5f; --c2:#3b4f7a; --c3:#d9a441; --dot: rgba(255,214,140,.14); }
.win { left: 130px; top: 110px; width: 1180px; height: 740px; }
.scene { position: relative; height: calc(100% - 46px); background: linear-gradient(180deg,#1a3147 0%,#0f2133 55%,#0a1622 100%); overflow: hidden; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene__isle { fill: #08121c; } .scene__isle--far { fill: #13263a; } .scene__sea { fill: #081420; } .scene__lamp { fill: #ffe2a8; }
.scene__tower-band { fill: #1a2d40; } .scene__tower-window { fill: #ffd68c; opacity: .55; } .scene__glints rect { fill: #ffd68c; opacity: .35; }
.fog { position: absolute; left: -20%; width: 140%; border-radius: 50%; background: radial-gradient(closest-side, rgba(214,226,236,.22), rgba(214,226,236,0)); filter: blur(8px); }
.fog--1 { bottom: 18%; height: 34%; } .fog--2 { bottom: 4%; height: 26%; opacity: .8; } .fog--3 { bottom: 34%; height: 22%; opacity: .5; }
.quest { position: absolute; left: 34px; top: 30px; padding: 14px 18px; border-radius: 14px; background: rgba(8,18,28,.55); border: 1px solid rgba(255,214,140,.35); color: #f1e6cf; backdrop-filter: blur(10px); }
.quest b { display: block; font-size: 13px; letter-spacing: .12em; color: #ffd68c; } .quest span { font-size: 19px; }
