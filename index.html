    <script>
      // Set the theme before the page paints so it never flashes the wrong colours.
      // Follow the system, unless the visitor overrode it with the toggle and the
      // system theme hasn't changed since (a newer system change wins).
      (function () {
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var theme = system
        try {
          var saved = localStorage.getItem('theme')
          if ((saved === 'light' || saved === 'dark') && localStorage.getItem('theme-system') === system) {
            theme = saved
          } else {
            localStorage.removeItem('theme')
            localStorage.removeItem('theme-system')
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
